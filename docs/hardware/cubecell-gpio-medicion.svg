<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<title>Medición de GPIO1 y GPIO2 en CubeCell HTCC-AB01</title>
<desc>Vista superior del CubeCell original con micro USB arriba. GPIO2 es el tercer contacto desde abajo a la derecha y abre la válvula; GPIO1 es el segundo y cierra. Dos diagramas separados muestran el voltímetro entre cada GPIO y GND.</desc>
