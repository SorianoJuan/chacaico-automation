<text x="758" y="786" font-size="19" style="fill:#536875">Son dos mediciones separadas: mové solo la punta roja.</text>
<rect x="38" y="846" width="1424" height="153" rx="12" fill="#e6edf2" stroke="none" stroke-width="2"/>
<text x="65" y="883" font-size="20" font-weight="bold">ANTES DE ALARGAR EL PULSO</text>
<text x="65" y="918" font-size="22">Para un pulso de varios segundos, aislá el CubeCell de la PCB de potencia y de la válvula.</text>
<text x="65" y="951" font-size="21">Tester en tensión continua (V DC), escala 20 V o automática. Nunca en corriente o continuidad.</text>
<text x="65" y="981" font-size="21">El GPIO es una señal lógica de ≈3,3 V. No es la salida de potencia que alimenta la válvula.</text>
<text x="48" y="1031" font-size="17" style="fill:#536875">Esquema de medición, no a escala. Posiciones según el pinout oficial HTCC-AB01 de Heltec.</text>
