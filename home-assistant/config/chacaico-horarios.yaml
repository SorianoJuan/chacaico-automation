automation:
- id: chacaico_horarios_reconcile
  alias: Chacaico · aplicar horarios y confirmar válvulas
  description: Recalcula el estado vigente; nunca reproduce aperturas históricas. Propiedad y cierre pendiente sobreviven
    reinicios.
  mode: queued
  max: 10
  max_exceeded: silent
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    seconds: /30
  - trigger: state
    entity_id:
    - schedule.chacaico_horario_valvula_1
    - valve.chacaico_node_1
    - sensor.chacaico_node_1_valve_command_status
    - schedule.chacaico_horario_valvula_2
    - valve.chacaico_node_2
    - sensor.chacaico_node_2_valve_command_status
    - schedule.chacaico_horario_valvula_3
    - valve.chacaico_node_3
    - sensor.chacaico_node_3_valve_command_status
    - schedule.chacaico_horario_valvula_4
    - valve.chacaico_node_4
    - sensor.chacaico_node_4_valve_command_status
  - trigger: mqtt
    topic: chacaico/lora/bridge/availability
    payload: online
  - trigger: state
    entity_id:
    - input_boolean.chacaico_temporada
    - input_boolean.chacaico_horario_1
    - input_boolean.chacaico_horario_2
    - input_boolean.chacaico_horario_3
    - input_boolean.chacaico_horario_4
    id: controls
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger is defined and trigger.id == "controls" }}'
    then:
    - action: homeassistant.save_persistent_states
  - repeat:
      for_each:
      - 1
      - 2
      - 3
      - 4
      sequence:
      - variables:
          node: '{{ repeat.item }}'
          schedule_entity: schedule.chacaico_horario_valvula_{{ node }}
          valve_entity: valve.chacaico_node_{{ node }}
          owned_entity: input_boolean.chacaico_horario_responsable_{{ node }}
          last_entity: input_text.chacaico_horario_ultimo_{{ node }}
          enabled: '{{ is_state(''input_boolean.chacaico_temporada'', ''on'') and is_state(''input_boolean.chacaico_horario_''
            ~ node, ''on'') }}'
          owned: '{{ is_state(owned_entity, "on") }}'
          clock: '{{ as_timestamp(now()) }}'
          end: '{{ as_timestamp(state_attr(schedule_entity, "next_event"), 0) }}'
          desired: '{{ "OPEN" if enabled and is_state(schedule_entity, "on") and end > clock + 2 else "CLOSE" }}'
          last: '{{ states(last_entity) | from_json({}) }}'
          last_at: '{{ last.get("at", 0) | float(0) }}'
          last_desired: '{{ last.get("desired", "") }}'
          actual: '{{ states(valve_entity) }}'
          confirmed_at: '{{ state_attr(valve_entity, "confirmed_at") | float(0) }}'
          command: '{{ states("sensor.chacaico_node_" ~ node ~ "_valve_command_status") }}'
          pending: '{{ command in ["Pendiente", "Sin confirmación; consultando"] }}'
          settled: '{{ actual == ("open" if desired == "OPEN" else "closed") and state_attr(valve_entity, "confirmation")
            == "confirmed" and confirmed_at >= last_at and last_desired == desired and not pending }}'
          retry_s: '{{ [60, (states("sensor.chacaico_node_" ~ node ~ "_metric_command_ttl_s") | float(0)) + 10]
            | max }}'
          send: '{{ (enabled or owned) and (last_desired != desired or (desired == "OPEN" and not settled and end != last.get("end",
            0)) or (not settled and (clock - last_at >= retry_s or clock < last_at))) }}'
      - if:
        - condition: template
          value_template: '{{ enabled and not owned }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ owned_entity }}'
      - if:
        - condition: template
          value_template: '{{ send }}'
        then:
        - action: input_text.set_value
          target:
            entity_id: '{{ last_entity }}'
          data:
            value: '{{ {"desired": desired, "at": clock, "end": end if desired == "OPEN" else 0} | to_json }}'
        - action: homeassistant.save_persistent_states
        - action: mqtt.publish
          data:
            topic: chacaico/lora/node/{{ node }}/valve/set
            payload: '{{ {"state": "OPEN", "valid_until": end} | to_json if desired == "OPEN" else "CLOSE" }}'
            qos: 1
            retain: false
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ not enabled and owned and settled and not send }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ owned_entity }}'
        - action: input_text.set_value
          target:
            entity_id: '{{ last_entity }}'
          data:
            value: '{}'
        - action: homeassistant.save_persistent_states
