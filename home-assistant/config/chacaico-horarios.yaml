# Native Schedule controller; persist responsibility before publishing any command.
input_boolean:
  chacaico_temporada:
    name: Temporada de riego
    icon: mdi:sprinkler-variant
  chacaico_horario_1:
    name: Usar horario válvula 1
    icon: mdi:calendar-check
  chacaico_horario_responsable_1:
    name: Riego pendiente de cierre 1
    icon: mdi:lock-clock
  chacaico_horario_2:
    name: Usar horario válvula 2
    icon: mdi:calendar-check
  chacaico_horario_responsable_2:
    name: Riego pendiente de cierre 2
    icon: mdi:lock-clock
  chacaico_horario_3:
    name: Usar horario válvula 3
    icon: mdi:calendar-check
  chacaico_horario_responsable_3:
    name: Riego pendiente de cierre 3
    icon: mdi:lock-clock
  chacaico_horario_4:
    name: Usar horario válvula 4
    icon: mdi:calendar-check
  chacaico_horario_responsable_4:
    name: Riego pendiente de cierre 4
    icon: mdi:lock-clock
input_text:
  chacaico_horario_ultimo_1:
    name: Última intención de horario 1
    max: 255
  chacaico_horario_ultimo_2:
    name: Última intención de horario 2
    max: 255
  chacaico_horario_ultimo_3:
    name: Última intención de horario 3
    max: 255
  chacaico_horario_ultimo_4:
    name: Última intención de horario 4
    max: 255
template:
- sensor:
  - name: Chacaico horario estado 1
    unique_id: chacaico_horario_estado_1
    default_entity_id: sensor.chacaico_horario_estado_1
    icon: mdi:calendar-clock
    state: |-
      {% set enabled = is_state('input_boolean.chacaico_temporada', 'on') and is_state('input_boolean.chacaico_horario_1', 'on') %}
      {% set owned = is_state('input_boolean.chacaico_horario_responsable_1', 'on') %}
      {% set s = states('schedule.chacaico_horario_valvula_1') %}
      {% set end = as_timestamp(state_attr('schedule.chacaico_horario_valvula_1','next_event'), 0) %}
      {% set target = 'open' if enabled and s == 'on' and end > as_timestamp(now()) + 2 else 'closed' %}
      {% set v = states('valve.chacaico_node_1') %}
      {% set cmd = states('sensor.chacaico_node_1_valve_command_status') %}
      {% set last = states('input_text.chacaico_horario_ultimo_1') | from_json({}) %}
      {% set pending = cmd in ['Pendiente', 'Sin confirmación; consultando'] %}
      {% set fresh = v == target and state_attr('valve.chacaico_node_1', 'confirmation') == 'confirmed' and (state_attr('valve.chacaico_node_1', 'confirmed_at') | float(0)) >= (last.get('at', 0) | float(0)) and last.get('desired') == ('OPEN' if target == 'open' else 'CLOSE') and not pending %}
      {% if not enabled and not owned %}Suspendido · control manual
      {% elif fresh %}{{ 'Apertura confirmada' if target == 'open' else 'Cierre confirmado' }}
      {% elif v in ['unavailable', 'unknown'] %}{{ 'Cierre pendiente · sin contacto' if target == 'closed' else 'Apertura pendiente · sin contacto' }}
      {% elif cmd == 'Vencida sin confirmar' %}Sin confirmar · reintentando
      {% else %}{{ 'Cierre pendiente' if target == 'closed' else 'Apertura pendiente' }}{% endif %}
  - name: Chacaico horario próximo 1
    unique_id: chacaico_horario_proximo_1
    default_entity_id: sensor.chacaico_horario_proximo_1
    icon: mdi:clock-outline
    state: |-
      {% set next = state_attr('schedule.chacaico_horario_valvula_1', 'next_event') %}
      {% if not is_state('input_boolean.chacaico_temporada','on') or not is_state('input_boolean.chacaico_horario_1','on') %}Suspendido
      {% elif next %}{{ 'Cierre' if is_state('schedule.chacaico_horario_valvula_1','on') else 'Apertura' }} · {{ as_local(as_datetime(next)).strftime('%d/%m %H:%M') }}
      {% else %}Sin franjas configuradas{% endif %}
